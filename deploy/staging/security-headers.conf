# Response headers for the staging web vhost.
#
# Kept in one file and `include`d into every location because nginx replaces —
# never merges — the inherited `add_header` set as soon as a location declares
# a header of its own. The values mirror apps/web/vercel.json, which serves the
# same bundle in production.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.staging.truckcontrol.local; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
