# Staging edge: the production nginx configuration, with the two differences a
# staging box actually needs — the web bundle is served here rather than from
# Vercel, and the upstream is a local process rather than a container.
#
# Everything the smoke tests assert (TLS, HSTS, the security headers, the rate
# limit zones, the private-network restriction on the probes, the SPA fallback)
# is byte-for-byte what `deploy/nginx.conf` and `apps/web/vercel.json` do in
# production. Paths are substituted by `up.sh`; nothing here is environment
# specific except __PLACEHOLDERS__.

worker_processes  1;
error_log  __ROOT__/logs/error.log warn;
pid        __ROOT__/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    __ROOT__/logs/access.log;
  client_body_temp_path __ROOT__/tmp/client_body;
  proxy_temp_path       __ROOT__/tmp/proxy;
  fastcgi_temp_path     __ROOT__/tmp/fastcgi;
  uwsgi_temp_path       __ROOT__/tmp/uwsgi;
  scgi_temp_path        __ROOT__/tmp/scgi;

  sendfile      on;
  server_tokens off;
  client_max_body_size 20m;
  client_body_timeout 30s;
  keepalive_timeout 65s;

  # `application/json` is deliberately NOT compressed — see deploy/nginx.conf:
  # compressing a response that mixes a secret with attacker-influenced content
  # is the shape BREACH exploits. Static assets carry no secret.
  gzip on;
  gzip_types application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;
  gzip_proxied off;

  # 503 (nginx's default) reads as "the server is broken"; 429 is what actually
  # happened, and it is the status the web client turns into "slow down".
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  # The application sets its own security headers (helmet) and so does this
  # edge. Without this block the browser receives BOTH — two
  # Strict-Transport-Security values (180 days from the app, 365 from here) and
  # an X-Frame-Options that says SAMEORIGIN and DENY at once. Browsers resolve
  # conflicting duplicates inconsistently, and the weaker value winning is a
  # silent downgrade. The edge is authoritative, so the upstream's copies are
  # dropped and exactly one value reaches the client.
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Permissions-Policy;

  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  upstream api_upstream {
    server 127.0.0.1:__API_PORT__;
    keepalive 32;
  }

  # `listen ... http2` rather than the standalone `http2 on;` — the latter is a
  # hard error on nginx < 1.25.1, and this box runs 1.24.
  server {
    listen 80;
    server_name _;
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------------------------------------------------------------------
  # API vhost
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl http2;
    server_name api.staging.truckcontrol.local;

    ssl_certificate     __ROOT__/certs/fullchain.pem;
    ssl_certificate_key __ROOT__/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Forward secrecy only; mirrors deploy/nginx.conf.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    limit_conn conn 50;

    # nginx's own 429 (the edge limiter) answered with an HTML body and no
    # Retry-After. Two problems: a client that parses `{ success, error }` gets
    # a parse failure instead of a code it can act on, and with no Retry-After
    # the usual behaviour is to retry immediately and deepen the overload.
    #
    # `error_page` only catches errors nginx GENERATES — `proxy_intercept_errors`
    # is off by default — so a 429 from the application, which carries its own
    # accurate Retry-After, passes through untouched.
    error_page 429 = @throttled;
    location @throttled {
      add_header Retry-After 1 always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
      default_type application/json;
      return 429 '{"success":false,"data":null,"error":{"code":"RATE_LIMITED","message":"Too many requests","details":null},"meta":null}';
    }

    location /api/v1/health {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://api_upstream;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api_upstream;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
    }

    location / {
      return 404;
    }
  }

  # ---------------------------------------------------------------------------
  # Web vhost — the built SPA. Mirrors apps/web/vercel.json.
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl http2;
    server_name staging.truckcontrol.local;

    ssl_certificate     __ROOT__/certs/fullchain.pem;
    ssl_certificate_key __ROOT__/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_tickets off;

    root __WEB_ROOT__;
    index index.html;

    # The header set is repeated in every location on purpose. nginx's
    # `add_header` does NOT merge with the enclosing level: a location that
    # declares even one header of its own replaces the inherited set entirely.
    # Declaring Cache-Control in the asset and index blocks therefore silently
    # dropped HSTS, nosniff, X-Frame-Options and the CSP from exactly the two
    # responses that matter most — the HTML document and the scripts it loads.
    # This mirrors apps/web/vercel.json, which is what serves production.
    include __ROOT__/security-headers.conf;

    # Hashed asset filenames are immutable; index.html never is, or a deploy
    # would be invisible to anyone with a warm cache.
    location /assets/ {
      include __ROOT__/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
      include __ROOT__/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: a deep link like /trips/<uuid> is a client route, and a 404
    # here is the classic "works until you refresh the page" bug (H-14).
    location / {
      include __ROOT__/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
