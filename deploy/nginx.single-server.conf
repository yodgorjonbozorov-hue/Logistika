# TruckAI — single-server edge: the app and the API on ONE domain.
#
#   https://truckai.example/          → the web bundle
#   https://truckai.example/api/v1/…  → the API
#
# Use this instead of deploy/nginx.conf when the frontend is hosted on the same
# box rather than on Vercel. For a firm running 5–40 trucks that is usually the
# right shape: one server, one certificate, one DNS record, no external account.
#
# Same-origin is also the safer arrangement, not merely the simpler one:
#
#   * there is no cross-origin request, so CORS never has to allow anything;
#   * the refresh cookie is first-party, so `SameSite=Strict` costs nothing;
#   * the app cannot be pointed at the wrong API by a mistyped build variable —
#     `VITE_API_URL=/api/v1` resolves against whatever origin served the page.
#
# Build the bundle with:  VITE_API_URL=/api/v1 pnpm --filter web build
#
# Everything security-related here is identical to deploy/nginx.conf; the only
# difference is that `location /` serves files instead of returning 404.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 20m;
  client_body_timeout 30s;
  keepalive_timeout 65s;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # `application/json` is deliberately NOT compressed: an API response can hold
  # a secret (the access token on login) beside attacker-influenced content, and
  # compressing the two together is the shape BREACH exploits. Static assets
  # carry no secret, so they still compress.
  gzip on;
  gzip_types application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;
  gzip_proxied off;

  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # The application sets its own security headers and so does this edge. Without
  # this the browser receives both — two Strict-Transport-Security values and an
  # X-Frame-Options that says SAMEORIGIN and DENY at once. Browsers resolve
  # conflicting duplicates inconsistently and the weaker value winning is a
  # silent downgrade, so the edge is made authoritative.
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Permissions-Policy;

  upstream api_upstream {
    server api:3000;
    keepalive 32;
  }

  # Plain HTTP: the ACME challenge and the redirect, nothing else.
  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    # `listen ... http2` rather than the standalone `http2 on;`: the latter is a
    # hard error on nginx < 1.25.1, which most distributions still ship.
    listen 443 ssl http2;
    server_name truckai.example;   # OPERATOR: set the real domain

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Forward secrecy only: a future compromise of the private key must not
    # decrypt traffic captured today.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/web;
    index index.html;

    limit_conn conn 50;

    # nginx's own 429 answered with an HTML body and no Retry-After: a client
    # parsing `{ success, error }` got a parse failure instead of a code it can
    # act on, and with no Retry-After the usual response is to retry at once.
    # `error_page` only catches errors nginx GENERATES (proxy_intercept_errors
    # is off by default), so a 429 from the application — which carries its own
    # accurate Retry-After — passes through untouched.
    error_page 429 = @throttled;
    location @throttled {
      add_header Retry-After 1 always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      default_type application/json;
      return 429 '{"success":false,"data":null,"error":{"code":"RATE_LIMITED","message":"Too many requests","details":null},"meta":null}';
    }

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    # The probes enumerate which dependencies exist and whether they are
    # healthy. They are for the orchestrator, not the internet.
    location /api/v1/health {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      include /etc/nginx/conf.d/api-headers.inc;
      proxy_pass http://api_upstream;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      include /etc/nginx/conf.d/api-headers.inc;
      proxy_pass http://api_upstream;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/conf.d/api-headers.inc;
      proxy_pass http://api_upstream;
    }

    # ---------------------------------------------------------------------
    # Web bundle
    # ---------------------------------------------------------------------
    # `add_header` does NOT merge with the enclosing level: a location that
    # declares even one header of its own replaces the inherited set entirely.
    # Declaring Cache-Control here without repeating the rest would silently
    # drop HSTS and the CSP from exactly the two responses that matter most —
    # the HTML document and the scripts it loads.
    location /assets/ {
      include /etc/nginx/conf.d/web-headers.inc;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
      include /etc/nginx/conf.d/web-headers.inc;
      add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: /trips/<uuid> is a client route, and a 404 here is the
    # classic "works until you refresh the page" bug.
    location / {
      include /etc/nginx/conf.d/web-headers.inc;
      try_files $uri $uri/ /index.html;
    }
  }
}
