# Edge proxy: TLS termination, the panel on /, the API on /api.
# Certificates come from certbot into /etc/letsencrypt (see docs/DEPLOY.md).

upstream panel { server web:80; }
upstream api   { server backend:3000; }

# HTTP exists only for the ACME challenge and to send everyone to HTTPS.
server {
  listen 80;
  server_name ${PANEL_DOMAIN};

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${PANEL_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${PANEL_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${PANEL_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  # HTTPS is mandatory (TZ §9); a year, so a browser refuses plain HTTP too.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Receipt photos: 15 MB is the backend's own upload limit.
  client_max_body_size 16m;

  # No trailing slash: the backend serves under /api/v1 itself, so the path is
  # passed through unchanged rather than rewritten.
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A report export over a slow link must not be cut off mid-file.
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://panel;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
