worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;          # do not advertise the nginx version
  client_max_body_size 20m;   # a little above MAX_UPLOAD_MB so the API, not
                              # nginx, produces the friendly error
  client_body_timeout 30s;
  keepalive_timeout 65s;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_min_length 1024;

  # Defence in depth: the application rate-limits per user/IP as well, but a
  # flood should be dropped at the edge before it ever reaches Node.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # Proxy headers are set once at http level and inherited by every location —
  # an `include` of a separate file would be one more thing to mount correctly.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  upstream api_upstream {
    server api:3000;
    keepalive 32;
  }

  # Plain HTTP: health check for the load balancer, everything else redirected.
  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    # `listen ... http2` rather than the newer standalone `http2 on;`: the
    # latter is a HARD ERROR on nginx < 1.25.1, which is what most distributions
    # still ship (Ubuntu 24.04 has 1.24). This form works on every version from
    # 1.9.5 onwards; on 1.25+ it only emits a deprecation warning, and a warning
    # beats a config the operator's nginx refuses to load.
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_conn conn 50;

    # The probes are for the orchestrator, not the internet: they enumerate
    # which dependencies exist and whether they are healthy. Deliberately NOT
    # rate limited in the application (a 429 would read as "unhealthy"), so
    # they are blocked here instead.
    location /api/v1/health {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://api_upstream;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api_upstream;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
    }

    location / {
      return 404;
    }
  }
}
