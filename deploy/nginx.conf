worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;          # do not advertise the nginx version
  client_max_body_size 20m;   # a little above MAX_UPLOAD_MB so the API, not
                              # nginx, produces the friendly error
  client_body_timeout 30s;
  keepalive_timeout 65s;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # `application/json` is deliberately NOT compressed. An API response can hold
  # a secret (the access token on login) alongside attacker-influenced content,
  # and compressing the two together is exactly the shape BREACH exploits: the
  # response length leaks how well the guess matched. Static assets carry no
  # secret, so they still compress.
  gzip on;
  gzip_types application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;
  gzip_proxied off;

  # Defence in depth: the application rate-limits per user/IP as well, but a
  # flood should be dropped at the edge before it ever reaches Node.
  # 503 (nginx's default) reads as "the server is broken"; 429 is what actually
  # happened, and it is the status the web client turns into "slow down".
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # Proxy headers are set once at http level and inherited by every location —
  # an `include` of a separate file would be one more thing to mount correctly.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  # The application sets its own security headers (helmet) and so does this
  # edge. Without this block the browser receives BOTH — two
  # Strict-Transport-Security values (180 days from the app, 365 from here) and
  # an X-Frame-Options that says SAMEORIGIN and DENY at once. Browsers resolve
  # conflicting duplicates inconsistently, and the weaker value winning is a
  # silent downgrade. The edge is authoritative, so the upstream's copies are
  # dropped and exactly one value reaches the client.
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Permissions-Policy;

  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  upstream api_upstream {
    server api:3000;
    keepalive 32;
  }

  # Plain HTTP: health check for the load balancer, everything else redirected.
  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    # `listen ... http2` rather than the newer standalone `http2 on;`: the
    # latter is a HARD ERROR on nginx < 1.25.1, which is what most distributions
    # still ship (Ubuntu 24.04 has 1.24). This form works on every version from
    # 1.9.5 onwards; on 1.25+ it only emits a deprecation warning, and a warning
    # beats a config the operator's nginx refuses to load.
    listen 443 ssl http2;
    # Replace with the real API hostname before going live. `_` answers for any
    # Host header, which means a request for someone else's domain pointed at
    # this IP is served from here — fine while a deployment has one certificate,
    # wrong the moment it has two.
    server_name api.truckai.example;   # OPERATOR: set the real domain

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Forward secrecy only: every suite here is ECDHE, so a future compromise of
    # the private key cannot decrypt traffic captured today. `HIGH:!aNULL:!MD5`
    # (the old value) still admitted static-RSA suites, which have no such
    # property. TLS 1.3 ignores this list and uses its own three suites.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets are encrypted with a key nginx keeps for the life of the
    # process and never rotates on its own; anyone who later obtains it can
    # decrypt every resumed session. The session cache above gives resumption
    # without that trade.
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # This origin serves JSON and nothing else: no scripts, no frames, no
    # embedding. Helmet sets the same CSP on the application's own responses;
    # setting it here too covers the responses nginx generates itself (429,
    # 502, the deny-all on /health) which never reach the application.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    limit_conn conn 50;

    # nginx's own 429 (the edge limiter) answered with an HTML body and no
    # Retry-After. Two problems: a client that parses `{ success, error }` gets
    # a parse failure instead of a code it can act on, and with no Retry-After
    # the usual behaviour is to retry immediately and deepen the overload.
    #
    # `error_page` only catches errors nginx GENERATES — `proxy_intercept_errors`
    # is off by default — so a 429 from the application, which carries its own
    # accurate Retry-After, passes through untouched.
    error_page 429 = @throttled;
    location @throttled {
      add_header Retry-After 1 always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
      default_type application/json;
      return 429 '{"success":false,"data":null,"error":{"code":"RATE_LIMITED","message":"Too many requests","details":null},"meta":null}';
    }

    # The probes are for the orchestrator, not the internet: they enumerate
    # which dependencies exist and whether they are healthy. Deliberately NOT
    # rate limited in the application (a 429 would read as "unhealthy"), so
    # they are blocked here instead.
    location /api/v1/health {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://api_upstream;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api_upstream;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
    }

    location / {
      return 404;
    }
  }
}
