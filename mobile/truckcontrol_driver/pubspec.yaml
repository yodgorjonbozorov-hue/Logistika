name: truckcontrol_driver
description: 'TruckControl AI - haydovchi ilovasi (offline-first)'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # Platform keystore for the session tokens (H-16):
  # EncryptedSharedPreferences on Android, Keychain on iOS.
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
