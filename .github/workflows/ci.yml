# Every push and pull request: lint, types, unit tests, and the e2e suites —
# tenant isolation and the trip-lifecycle smoke path — against a real
# PostgreSQL (docs/SECURITY.md F-7).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic values; the e2e job overrides DATABASE_URL for its service.
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
  WEB_URL: http://localhost:5173

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter backend exec prisma generate

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm test

  e2e:
    name: E2E suites (real database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truckcontrol
          POSTGRES_PASSWORD: truckcontrol
          POSTGRES_DB: truckcontrol_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U truckcontrol"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://truckcontrol:truckcontrol@localhost:5432/truckcontrol_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter backend exec prisma generate

      # The same command the production image runs, so a broken migration is
      # found here rather than on a first deploy.
      - run: pnpm --filter backend exec prisma migrate deploy

      # The service container hands out a superuser, and a superuser is exempt
      # from row-level security — the suites would pass while the third
      # isolation layer sat inert. So the tests run as the same kind of role
      # production uses: owner of the schema, but NOSUPERUSER NOBYPASSRLS.
      - name: Hand the schema to a non-superuser app role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE truckcontrol_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB;
          ALTER SCHEMA public OWNER TO truckcontrol_app;
          GRANT ALL ON SCHEMA public TO truckcontrol_app;
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
              EXECUTE format('ALTER TABLE public.%I OWNER TO truckcontrol_app', r.tablename);
            END LOOP;
            FOR r IN SELECT t.typname FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
                     WHERE n.nspname = 'public' AND t.typtype = 'e' LOOP
              EXECUTE format('ALTER TYPE public.%I OWNER TO truckcontrol_app', r.typname);
            END LOOP;
            EXECUTE 'ALTER FUNCTION public.app_current_company() OWNER TO truckcontrol_app';
          END $$;
          SQL

      - run: pnpm --filter backend test:e2e
        env:
          DATABASE_URL: postgresql://truckcontrol_app:ci-app-password@localhost:5432/truckcontrol_test?schema=public
